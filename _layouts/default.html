<!doctype html>
<html lang="{{ page.lang | default: site.lang | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#content">К содержанию</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">DVACHERS Travel</a>
    <nav aria-label="Основное">
      <a href="{{ '/indonesia/voa-extension/' | relative_url }}">Продление VOA</a>
      <a href="https://github.com/kostia7alania/dvachers-travel">Навыки и исходники</a>
    </nav>
  </header>
  <main id="content" tabindex="-1">
    <article>{{ content }}</article>
  </main>
  <footer>
    <p>Нашли изменение? <a href="https://github.com/kostia7alania/dvachers-travel/issues/new/choose">Предложить исправление</a>.</p>
    <p>Сохраняем даты, источники и местные условия. Опыт одного офиса не заменяет проверку требований вашего.</p>
  </footer>
</body>
</html>
